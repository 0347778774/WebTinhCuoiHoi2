<style>
/* Sửa tên / ngày / lời cảm ơn ở biến CONFIG trong <script> phía dưới */
:root{
  --script:'Pinyon Script','Alex Brush',cursive;          /* tên cô dâu chú rể */
  --letter:'Pinyon Script',cursive;     /* thư cảm ơn */
  --hand:'WindSong',cursive;            /* ca dao viết tay */
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --display:'Playfair Display',Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --green:#344f36;      /* chữ chính - xanh rêu đậm */
  --green2:#5d7c52;     /* xanh lá vừa */
  --sage:#a9c08c;       /* xanh lá nhạt */
  --rose:#c06a80;       /* hồng sen - điểm nhấn */
  --gold:#a88d4f;
  --cream:#fbfaf1;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#f4f6e9;font-family:var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;-webkit-font-smoothing:antialiased}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--cream)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
svg{overflow:visible}

/* ---------- Slides ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.6s ease,visibility 0s 1.6s,filter 1.6s ease;filter:blur(8px)}
.slide.active{opacity:1;visibility:visible;transition:opacity 1.6s ease,visibility 0s,filter 1.6s ease;filter:none;z-index:2}
.bg{position:absolute;inset:-2%}
.slide.active .bg{animation:kenburns 22s ease-out both}
@keyframes kenburns{from{transform:scale(1.07)}to{transform:scale(1)}}
.abs{position:absolute}
.full{position:absolute;inset:0;width:100%;height:100%}
*{font-variant-numeric:lining-nums !important}
.cx{left:0;right:0;text-align:center}

/* ---------- Animation primitives ---------- */
.slide .a{opacity:0}
.slide.active .a-up{animation:aUp 1.5s var(--d,0s) var(--ease) both}
.slide.active .a-down{animation:aDown 1.4s var(--d,0s) var(--ease) both}
.slide.active .a-zoom{animation:aZoom 1.8s var(--d,0s) var(--ease) both}
.slide.active .a-fade{animation:aFade 2.2s var(--d,0s) ease both}
.slide.active .a-left{animation:aLeft 1.8s var(--d,0s) var(--ease) both}
.slide.active .a-right{animation:aRight 1.8s var(--d,0s) var(--ease) both}
.slide.active .a-rise{animation:aRise 2.6s var(--d,0s) var(--ease) both}
@keyframes aUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes aDown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes aZoom{from{opacity:0;transform:scale(.6);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes aFade{from{opacity:0}to{opacity:1}}
@keyframes aLeft{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes aRight{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
@keyframes aRise{from{opacity:0;transform:translateY(160px)}to{opacity:1;transform:none}}

.chars .ch{display:inline-block;opacity:0;white-space:pre}
.slide.active .chars .ch{animation:chIn 1.1s calc(var(--d,0s) + var(--i) * 70ms) var(--ease) both}
@keyframes chIn{0%{opacity:0;transform:translateY(-30px);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}

.words .w{display:inline-block;opacity:0;white-space:pre}
.slide.active .words .w{animation:wIn 1.1s calc(var(--d,0s) + var(--i) * 110ms) var(--ease) both}
@keyframes wIn{0%{opacity:0;transform:translateY(20px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}

/* chữ viết tay - quét mask */
.write{display:inline-block;padding:.6em .4em .3em;margin:-.6em -.4em -.3em;
  -webkit-mask-image:linear-gradient(90deg,#000 42%,transparent 58%);mask-image:linear-gradient(90deg,#000 42%,transparent 58%);
  -webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:100% 0;mask-position:100% 0}
.slide.active .write{animation:writeIn 2.6s var(--d,0s) cubic-bezier(.45,.05,.35,1) both}
@keyframes writeIn{to{-webkit-mask-position:0 0;mask-position:0 0}}

.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.hy path{fill:none;stroke-linecap:square;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .hy path{animation:draw 1.1s calc(var(--d,0s) + var(--i) * 110ms) ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* chuồn chuồn */
.df .wing{transform-box:fill-box;animation:flut .12s linear infinite alternate}
.df .wing.t{transform-origin:50% 100%}
.df .wing.b{transform-origin:50% 0%}
@keyframes flut{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
.fly{position:absolute;left:0;top:0;width:120px;height:120px}
.slide.active .fly1{animation:fly1 24s linear infinite}
.slide.active .fly2{animation:fly2 30s 4s linear infinite}
@keyframes fly1{0%{transform:translate(-160px,520px) rotate(8deg)}20%{transform:translate(380px,380px) rotate(-4deg)}28%{transform:translate(400px,372px) rotate(-2deg)}50%{transform:translate(900px,250px) rotate(6deg)}58%{transform:translate(915px,262px) rotate(4deg)}80%{transform:translate(1450px,180px) rotate(-6deg)}100%{transform:translate(2100px,260px) rotate(4deg)}}
@keyframes fly2{0%{transform:translate(2080px,700px) scale(.75) scaleX(-1)}25%{transform:translate(1560px,620px) scale(.75) scaleX(-1)}35%{transform:translate(1540px,628px) scale(.75) scaleX(-1)}65%{transform:translate(900px,820px) scale(.75) scaleX(-1)}100%{transform:translate(-200px,640px) scale(.75) scaleX(-1)}}

/* ======== nền màu nước dùng chung ======== */
.paper{background:
   radial-gradient(ellipse at 50% 45%,#ffffff 0%,#fcfbf3 45%,#f3f5e4 100%)}

/* ======== SLIDE 1 · BÌA ======== */
.s1 .title{top:110px;font:400 66px/1 var(--display);letter-spacing:.06em;color:var(--rose)}
.s1 .orn{top:200px;left:50%;width:360px;margin-left:-180px}
.s1 .nm{font:400 190px/1 var(--script);color:var(--green);white-space:nowrap}
.s1 .n1{left:0;right:0;text-align:center;top:235px;padding-right:140px}
.s1 .n2{left:0;right:0;text-align:center;top:505px;padding-left:200px}
.s1 .rings{left:50%;top:470px;width:120px;margin-left:-40px}
.s1 .dateblock{top:790px;color:var(--green)}
.s1 .month{font:400 30px/1 var(--display);letter-spacing:.42em;padding-left:.42em}
.s1 .row{display:flex;align-items:center;justify-content:center;gap:26px;margin:10px 0}
.s1 .side{width:270px;border-top:1.5px solid var(--green2);border-bottom:1.5px solid var(--green2);padding:11px 0;font:400 26px/1 var(--display);letter-spacing:.18em;white-space:nowrap}

/* ======== SLIDE 2 · THƯ CẢM ƠN ======== */
.s2 .letter{left:470px;width:1300px;top:150px;text-align:center;color:var(--green);font:400 54px/1.7 var(--letter);white-space:nowrap}
.s2 .letter .first{font:400 64px/1.5 var(--letter)}
.s2 .sig{left:1060px;top:740px;white-space:nowrap;font:400 120px/1 var(--script);color:var(--green)}

.s2 .hy-s{left:900px;top:800px;width:90px}

/* ======== SLIDE 3 · CA DAO ======== */
.s3 .band{left:200px;top:0;width:190px;height:470px}
.s3 .band-t{left:200px;width:190px;top:90px;text-align:center;font:400 58px/1.35 var(--display);color:var(--green);letter-spacing:.06em}

.s3 .v1{left:480px;top:390px}
.s3 .v2{left:620px;top:530px}
.s3 .v3{left:660px;top:670px}
.s3 .v4{left:880px;top:810px}
.s3 .vdate{left:1720px;top:560px;width:200px;text-align:center;font:400 58px/1.35 var(--display);color:var(--green);letter-spacing:.05em}
.s3 .vline{left:1819px;top:500px;width:2px;height:40px;background:var(--green2);opacity:.5}

/* ======== SLIDE 4 · KẾT ======== */
.s4 .arch{left:50%;top:70px;width:640px;height:900px;margin-left:-320px;border-radius:320px 320px 26px 26px;background:rgba(255,255,255,.78);box-shadow:0 20px 60px rgba(90,120,70,.15);border:2px solid #c7d4ad}
.s4 .arch::after{content:'';position:absolute;inset:14px;border-radius:306px 306px 16px 16px;border:1px solid #d7e1c1}
.s4 .a-title{top:200px;font:400 40px/1 var(--display);letter-spacing:.08em;color:var(--rose);padding-left:.24em}
.s4 .a-n1{top:290px;font:400 112px/1 var(--script);color:var(--green);white-space:nowrap}

.s4 .left-t,.s1 .nm,.s2 .sig,.s3 .verse{text-shadow:0 0 14px rgba(255,255,255,.95),0 0 30px rgba(251,250,241,.9)}
.s4 .left-t{left:80px;top:330px;width:520px;text-align:center}
.s4 .left-t .big{font:400 100px/1.2 var(--script);color:var(--green)}

/* ---------- Điều khiển ---------- */
#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:40px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(60,90,50,.18);transition:opacity .6s,transform .6s;font-family:system-ui,sans-serif}

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- cánh sen hồng: gốc trắng, đầu hồng -->
    <linearGradient id="gLotusP" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffdf6"/><stop offset=".5" stop-color="#fbe4e8"/><stop offset="1" stop-color="#e79bb0"/></linearGradient>
    <!-- cánh sen trắng: gốc xanh nhạt -->
    <linearGradient id="gLotusW" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e3ecc8"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf6f3"/></linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d9a8"/><stop offset=".55" stop-color="#93b07c"/><stop offset="1" stop-color="#6c8d61"/></linearGradient>
    <linearGradient id="gLeaf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8cf98"/><stop offset="1" stop-color="#5f8159"/></linearGradient>
    <linearGradient id="gPod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7d99a"/><stop offset="1" stop-color="#8fa26a"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e3b0"/><stop offset=".35" stop-color="#b8974f"/><stop offset=".6" stop-color="#efd99b"/><stop offset="1" stop-color="#9c7b33"/></linearGradient>
    <linearGradient id="gWingD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,.9)"/><stop offset="1" stop-color="rgba(220,170,185,.55)"/></linearGradient>
    <!-- hiệu ứng loang màu nước -->
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="90"/>
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="wcEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
  </defs>
</svg>

<div id="stage">

  <!-- ===== 1. TRANG BÌA ===== -->
  <section class="slide s1">
    <div class="bg paper"><svg class="full wash" viewBox="0 0 1920 1080"></svg></div>
    <svg class="full deco" viewBox="0 0 1920 1080"></svg>
    <div class="abs title cx"><span class="chars" style="--d:.4s" data-bind="title"></span></div>
    <svg class="abs orn a a-fade" style="--d:1.2s" viewBox="0 0 360 30"></svg>
    <div class="abs nm n1"><span class="write" style="--d:1.4s" data-bind="bride"></span></div>
    <div class="abs rings a a-zoom" style="--d:2.8s"><div class="float"><svg class="ring-svg" viewBox="0 0 240 180"></svg></div></div>
    <div class="abs nm n2"><span class="write" style="--d:3.1s" data-bind="groom"></span></div>
    <div class="abs dateblock cx">
      <div class="month a a-down" style="--d:4.6s" data-bind="monthNum"></div>
      <div class="row">
        <div class="side a a-left" style="--d:5s" data-bind="weekday"></div>
        <div class="day a a-zoom" style="--d:4.8s" data-bind="dayNum"></div>
        <div class="side a a-right" style="--d:5s" data-bind="lunarCanChi"></div>
      </div>
      <div class="year a a-up" style="--d:5.4s" data-bind="yearNum"></div>
    </div>
    <div class="fly fly1"><svg class="df-svg" viewBox="-60 -60 120 120"></svg></div>
  </section>

  <!-- ===== 2. THƯ CẢM ƠN ===== -->
  <section class="slide s2">
    <div class="bg paper"><svg class="full wash" viewBox="0 0 1920 1080"></svg></div>
    <svg class="full deco" viewBox="0 0 1920 1080"></svg>
    <div class="abs letter"></div>
    <div class="abs sig"><span class="write" style="--d:6.4s" data-bind="bride"></span></div>
    <div class="abs sig sig2"><span class="write" style="--d:7.4s" data-bind="groom"></span></div>
    <div class="abs hy-s a a-fade" style="--d:7s"><svg class="hy" viewBox="-6 -6 112 120"></svg></div>
    <div class="fly fly2"><svg class="df-svg" viewBox="-60 -60 120 120"></svg></div>
  </section>

  <!-- ===== 3. CA DAO ===== -->
  <section class="slide s3">
    <div class="bg paper"><svg class="full wash" viewBox="0 0 1920 1080"></svg></div>
    <svg class="abs band a a-down" style="--d:.2s" viewBox="0 0 190 470" preserveAspectRatio="none">
      <rect x="0" y="-40" width="190" height="510" fill="rgba(178,201,140,.5)" filter="url(#wcEdge)"/>
    </svg>
    <div class="abs band-t"><div class="chars" style="--d:.8s">LỄ</div><div class="chars" style="--d:1s">ĂN</div><div class="chars" style="--d:1.2s">HỎI</div></div>
    <svg class="full deco" viewBox="0 0 1920 1080"></svg>
    <div class="abs couple"><div class="chars" style="--d:1.4s" data-bind="brideU"></div><div class="a a-zoom" style="--d:2s">&amp;</div><div class="chars" style="--d:2.2s" data-bind="groomU"></div></div>
    <div class="abs verse v1"><span class="write" style="--d:3s">Anh về hái lấy</span></div>
    <div class="abs verse v2"><span class="write" style="--d:4.4s">buồng cau,</span></div>
    <div class="abs verse v3"><span class="write" style="--d:5.6s">Trầu têm cánh phượng</span></div>
    <div class="abs verse v4"><span class="write" style="--d:7s">đội đầu mang sang</span></div>
    <div class="abs vline a a-fade" style="--d:8.2s"></div>
    <div class="abs vdate a a-up" style="--d:8.4s"><div data-bind="dayNum"></div><div data-bind="monthPad"></div><div data-bind="yearNum"></div></div>
  </section>

  <!-- ===== 4. KẾT ===== -->
  <section class="slide s4">
    <div class="bg paper"><svg class="full wash" viewBox="0 0 1920 1080"></svg></div>
    <svg class="full deco" viewBox="0 0 1920 1080"></svg>
    <div class="abs arch a a-rise" style="--d:.3s">
      <div class="abs a-title cx"><span class="chars" style="--d:1.4s" data-bind="title"></span></div>
      <div class="abs a-n1 cx"><span class="write" style="--d:2s" data-bind="bride"></span></div>
      <div class="abs a-hy"><svg class="hy" viewBox="-6 -6 112 120" style="--d:3s"></svg></div>
      <div class="abs a-n2 cx"><span class="write" style="--d:3.6s" data-bind="groom"></span></div>
      <div class="abs a-date cx a a-up" style="--d:5s" data-bind="solar"></div>
      <svg class="abs arch-lotus" viewBox="0 0 640 900" style="left:0;top:0;width:640px;height:900px"></svg>
    </div>
    <div class="abs left-t"><div class="big"><span class="write" style="--d:5.6s">Trân trọng</span></div><div class="big"><span class="write" style="--d:6.6s">cảm ơn</span></div></div>
    <div class="abs right-t"><div class="words" style="--d:7.2s" data-bind="bye1"></div><div class="words" style="--d:7.9s" data-bind="bye2"></div><div class="words" style="--d:8.6s" data-bind="bye3"></div></div>
  </section>

</div>

<canvas id="fx"></canvas>
<div id="bar"></div>
<div id="hint">← → chuyển trang · Space tạm dừng · F toàn màn hình · M nhạc · H ẩn thanh điều khiển</div>
<div id="ui">
  <button id="bPrev" title="Trang trước (←)">&#10094;</button>
  <button id="bPlay" title="Tạm dừng / Phát (Space)">&#10074;&#10074;</button>
  <button id="bNext" title="Trang sau (→)">&#10095;</button>
  <div id="dots"></div>
  <button id="bMusic" class="off" title="Nhạc nền (M)">&#9835;</button>
  <button id="bFull" title="Toàn màn hình (F)">&#x26F6;</button>
</div>
<audio id="bgm" loop preload="auto"></audio>

<script>
/* =========================================================
   CẤU HÌNH — sửa tại đây
   ========================================================= */
const CONFIG = {
  title : 'LỄ ĂN HỎI',
  groom : 'Đức Trưởng',
  bride : 'Hồng Nhung',
  date  : '2026-10-10',          // Ngày dương lịch YYYY-MM-DD — thứ & âm lịch tự tính
  lunarOverride : '',            // Muốn tự ghi âm lịch, ví dụ '09.09'
  slideSeconds : 15,             // Thời gian mỗi trang (giây)
  music : 'nhac.mp3',            // File nhạc đặt cùng thư mục ('' nếu không dùng)
  // Thư cảm ơn (trang 2) — mỗi phần tử là một dòng
  letter : [
    'Trong ngày Ăn Hỏi hôm nay,',
    'chúng con xin gửi lời cảm ơn chân thành đến hai bên gia đình',
    'đã luôn yêu thương, nuôi dưỡng và dạy dỗ chúng con nên người.',
    'Sự hiện diện và lời chúc phúc của gia đình',
    'là niềm hạnh phúc và may mắn lớn nhất của chúng con.',
  ],
  bye1 : 'quý vị đã đến chung vui',
  bye2 : 'và gửi lời chúc phúc',
  bye3 : 'cho hai gia đình chúng tôi',
};

/* ===== Âm lịch (thuật toán Hồ Ngọc Đức, GMT+7) ===== */
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd}
function newMoon(k,tz){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C-=0.4068*Math.sin(Mp*dr)-0.0161*Math.sin(dr*2*Mp);C-=0.0004*Math.sin(dr*3*Mp);C+=0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mp));C-=0.0074*Math.sin(dr*(M-Mp))+0.0004*Math.sin(dr*(2*F+M));C-=0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mp));C+=0.0010*Math.sin(dr*(2*F-Mp))+0.0005*Math.sin(dr*(2*Mp+M));const dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return Math.floor(J+C-dt+0.5+tz/24)}
function sunLong(jdn,tz){const T=(jdn-2451545.5-tz/24)/36525,T2=T*T,dr=Math.PI/180;const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return Math.floor(L/Math.PI*6)}
function month11(yy,tz){const k=Math.floor((jdFromDate(31,12,yy)-2415021)/29.530588853);let nm=newMoon(k,tz);if(sunLong(nm,tz)>=9)nm=newMoon(k-1,tz);return nm}
function leapOff(a11,tz){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last,i=1,arc=sunLong(newMoon(k+i,tz),tz);do{last=arc;i++;arc=sunLong(newMoon(k+i,tz),tz)}while(arc!=last&&i<14);return i-1}
function solar2lunar(dd,mm,yy,tz=7){const dn=jdFromDate(dd,mm,yy),k=Math.floor((dn-2415021.076998695)/29.530588853);let ms=newMoon(k+1,tz);if(ms>dn)ms=newMoon(k,tz);let a11=month11(yy,tz),b11=a11,ly;if(a11>=ms){ly=yy;a11=month11(yy-1,tz)}else{ly=yy+1;b11=month11(yy+1,tz)}const ld=dn-ms+1,diff=Math.floor((ms-a11)/29);let leap=0,lm=diff+11;if(b11-a11>365){const lo=leapOff(a11,tz);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1}}if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;return[ld,lm,ly,leap]}
const CAN=['Canh','Tân','Nhâm','Quý','Giáp','Ất','Bính','Đinh','Mậu','Kỷ'];
const CHI=['Thân','Dậu','Tuất','Hợi','Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi'];
const THU=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

/* ===== Dữ liệu ===== */
const pad=n=>String(n).padStart(2,'0');
const [Y,Mo,D]=CONFIG.date.split('-').map(Number);
const lun=solar2lunar(D,Mo,Y);
const lunarStr=CONFIG.lunarOverride||`${pad(lun[0])}.${pad(lun[1])}`;
const canchi=`${CAN[lun[2]%10]} ${CHI[lun[2]%12]}`;
const DATA={
  title:CONFIG.title, groom:CONFIG.groom, bride:CONFIG.bride,
  groomU:CONFIG.groom.toUpperCase(), brideU:CONFIG.bride.toUpperCase(),
  monthNum:`THÁNG ${Mo}`, monthPad:pad(Mo),
  weekday:THU[new Date(Y,Mo-1,D).getDay()].toUpperCase(),
  dayNum:pad(D), yearNum:String(Y),
  lunarCanChi:`${lunarStr} ${canchi.toUpperCase()}`,
  solar:`${pad(D)}.${pad(Mo)}.${Y}`,
  bye1:CONFIG.bye1, bye2:CONFIG.bye2, bye3:CONFIG.bye3,
};
document.querySelectorAll('[data-bind]').forEach(el=>{el.textContent=DATA[el.dataset.bind]??''});

/* thư cảm ơn: từng dòng hiện lần lượt */
const letterEl=document.querySelector('.s2 .letter');
CONFIG.letter.forEach((line,i)=>{const d=document.createElement('div');d.className='words'+(i===0?' first':'');d.style.setProperty('--d',(1+i*0.95).toFixed(2)+'s');d.textContent=line;letterEl.appendChild(d)});

/* tách ký tự / từ */
document.querySelectorAll('.chars').forEach(el=>{const t=el.textContent.normalize('NFC');el.textContent='';el.setAttribute('aria-label',t);
  Array.from(t).forEach((c,i)=>{const s=document.createElement('span');s.className='ch';s.style.setProperty('--i',i);s.textContent=c;el.appendChild(s)})});
document.querySelectorAll('.words').forEach(el=>{const t=el.textContent.normalize('NFC');el.textContent='';
  t.split(/(\s+)/).forEach((w,i)=>{const s=document.createElement('span');s.className='w';s.style.setProperty('--i',Math.floor(i/2));s.textContent=w;el.appendChild(s)})});

/* =========================================================
   HỌA TIẾT SEN MÀU NƯỚC (SVG vẽ bằng code)
   ========================================================= */
let seed=11;const rnd=(a,b)=>{seed=(seed*16807)%2147483647;return a+(seed/2147483647)*(b-a)};

function petal(r,len,w,fill,stroke='rgba(190,120,140,.35)'){
  return `<path d="M0 0 C${-w} ${-len*.28} ${-w*.75} ${-len*.78} 0 ${-len} C${w*.75} ${-len*.78} ${w} ${-len*.28} 0 0Z" transform="rotate(${r})" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`+
         `<path d="M0 -6 L0 ${-len*.85}" transform="rotate(${r})" stroke="${stroke}" stroke-width=".8" opacity=".6"/>`;
}
/* bông sen: type 'p' hồng | 'w' trắng */
function lotus(x,y,s,type='p',stem=0){
  const f=type==='w'?'url(#gLotusW)':'url(#gLotusP)',st=type==='w'?'rgba(150,170,120,.45)':'rgba(190,110,135,.4)';
  let g=`<g transform="translate(${x} ${y}) scale(${s})"><g class="sway" style="animation-duration:${rnd(7,11).toFixed(1)}s">`;
  if(stem)g+=`<path d="M0 0 C-6 ${stem*.35} 8 ${stem*.7} 2 ${stem}" stroke="#86a26c" stroke-width="6" fill="none"/>`;
  g+=petal(-70,70,30,f,st)+petal(70,70,30,f,st)+petal(-42,100,34,f,st)+petal(42,100,34,f,st)+petal(-18,112,32,f,st)+petal(18,112,32,f,st);
  g+=`<ellipse cx="0" cy="-10" rx="30" ry="12" fill="#f0d27c" opacity=".9"/>`;
  for(let i=0;i<12;i++)g+=`<line x1="${-24+i*4.4}" y1="-10" x2="${-28+i*5}" y2="${-24-rnd(0,8)}" stroke="#d9b14f" stroke-width="1.6"/>`;
  g+=petal(-28,92,36,f,st)+petal(28,92,36,f,st)+petal(0,104,36,f,st);
  return g+'</g></g>';
}
function bud(x,y,s,type='p',stem=200){
  const f=type==='w'?'url(#gLotusW)':'url(#gLotusP)';
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="sway" style="animation-duration:${rnd(6,10).toFixed(1)}s"><path d="M0 0 C-4 ${stem*.4} 5 ${stem*.7} 0 ${stem}" stroke="#86a26c" stroke-width="5" fill="none"/>
   <path d="M0 0 C-30 -28 -16 -78 0 -100 C16 -78 30 -28 0 0Z" fill="${f}" stroke="rgba(170,120,130,.4)" stroke-width="1.2"/>
   <path d="M0 0 C-16 -24 -8 -66 0 -96" stroke="rgba(170,120,130,.35)" fill="none"/></g></g>`;
}
/* lá sen nhìn nghiêng (hình chén) */
function leaf(x,y,s,r=0,stem=0){
  let g=`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><g class="sway" style="animation-duration:${rnd(8,12).toFixed(1)}s">`;
  if(stem)g+=`<path d="M0 10 C6 ${stem*.4} -6 ${stem*.7} 0 ${stem}" stroke="#7e9a66" stroke-width="7" fill="none"/>`;
  g+=`<path d="M-140 -22 C-128 -78 128 -78 140 -22 C122 56 -122 56 -140 -22Z" fill="url(#gLeaf)" stroke="#6c8d61" stroke-width="2"/>`;
  g+=`<path d="M-140 -22 C-92 -66 92 -66 140 -22 C90 -40 -90 -40 -140 -22Z" fill="#dfe9c6" opacity=".7"/>`;
  for(let i=0;i<9;i++){const a=Math.PI*(.06+i*.11);g+=`<path d="M0 12 Q${(Math.cos(a)*-70).toFixed(0)} ${(12+Math.sin(a)*4).toFixed(0)} ${(Math.cos(a)*-130).toFixed(0)} ${(Math.sin(a)*22-4).toFixed(0)}" stroke="#e7efd5" stroke-width="1.5" fill="none" opacity=".55"/>`}
  return g+'</g></g>';
}
/* lá sen tròn nhìn từ trên */
function padLeaf(x,y,s,r=0){
  let g=`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s} ${s*.55})"><path d="M0 0 L118 -22 A120 120 0 1 0 118 22Z" fill="url(#gLeaf2)" stroke="#5f8159" stroke-width="2" opacity=".95"/>`;
  for(let i=0;i<11;i++){const a=.25+i*.53;g+=`<line x1="0" y1="0" x2="${(Math.cos(a)*116).toFixed(0)}" y2="${(Math.sin(a)*116).toFixed(0)}" stroke="#d9e6c4" stroke-width="1.6" opacity=".5"/>`}
  return g+'</g>';
}
/* gương sen */
function pod(x,y,s,stem=180,r=0){
  let g=`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><g class="sway"><path d="M0 26 C-4 ${stem*.4} 6 ${stem*.7} 0 ${stem}" stroke="#86a26c" stroke-width="5" fill="none"/>
   <path d="M-30 0 L30 0 C26 18 10 28 0 30 C-10 28 -26 18 -30 0Z" fill="url(#gPod)" stroke="#7d8f58"/><ellipse cx="0" cy="0" rx="30" ry="8" fill="#c9cf8a" stroke="#7d8f58"/>`;
  [[-14,0],[0,-2],[14,0],[-7,3],[7,3]].forEach(([a,b])=>g+=`<circle cx="${a}" cy="${b}" r="2.6" fill="#6f7f4a"/>`);
  return g+'</g></g>';
}
/* cụm sen góc trái (giống mẫu) */
function clusterLeft(){
  return leaf(150,560,1,-8,560)+pod(40,720,.9,380,-6)+bud(330,520,.8,'p',600)+
    lotus(210,340,1.15,'p',760)+leaf(330,760,.9,10,340)+lotus(150,840,1.05,'w',260)+leaf(70,940,1.1,-4,200)+
    bud(260,700,.6,'w',380)+lotus(420,620,.55,'p',470);
}
function clusterTopRight(){
  return leaf(1760,230,.85,-12)+lotus(1720,180,.9,'p')+bud(1860,150,.6,'p',140)+lotus(1600,120,.45,'w');
}
function wash(spots){
  return `<g filter="url(#wc)">${spots.map(([x,y,r,c,o])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.75}" fill="${c}" opacity="${o}"/>`).join('')}</g>`;
}
const G1='#b9cf95',G2='#d7e4b8',P1='#f3d3db';

/* chữ Hỷ dựng nét */
function hyPaths(){const P=[];const half=cx=>{P.push(`M${cx-14} 5 H${cx+14}`,`M${cx} -2 V17`,`M${cx-14} 28 H${cx+14} V46 H${cx-14} Z`,`M${cx-11} 52 L${cx-7} 60`,`M${cx+11} 52 L${cx+7} 60`,`M${cx-17} 76 H${cx+17} V102 H${cx-17} Z`)};
  half(24);half(76);P.splice(2,0,'M2 17 H98');P.push('M2 66 H98');return P.map((d,i)=>`<path d="${d}" pathLength="1" style="--i:${i}"/>`).join('')}
document.querySelectorAll('svg.hy').forEach(s=>s.innerHTML=hyPaths());

/* nhẫn */
document.querySelectorAll('.ring-svg').forEach(s=>s.innerHTML=`<g fill="none"><ellipse cx="95" cy="110" rx="58" ry="52" stroke="url(#gGold)" stroke-width="8"/><ellipse cx="148" cy="96" rx="58" ry="52" stroke="url(#gGold)" stroke-width="8"/><path d="M60 70 A58 52 0 0 1 120 60" stroke="url(#gGold)" stroke-width="8"/></g>
 <g transform="translate(148 44)"><polygon points="0,-20 15,-5 0,15 -15,-5" fill="#fff" stroke="#b8974f" stroke-width="2.5"/><path class="twinkle" d="M0 -38 L3 -29 L12 -26 L3 -23 L0 -14 L-3 -23 L-12 -26 L-3 -29Z" fill="#fff4cc"/></g>`);

/* hoạ tiết gạch nối dưới tiêu đề */
document.querySelector('.s1 .orn').innerHTML=`<path d="M10 15 H150 M210 15 H350" stroke="#c7b27a" stroke-width="1.5"/><g transform="translate(180 15)"><path d="M0 -10 C-6 -4 -6 4 0 10 C6 4 6 -4 0 -10Z" fill="#e8a8b9"/><path d="M-10 0 C-4 -6 4 -6 10 0 C4 6 -4 6 -10 0Z" fill="#b9cf95"/></g><circle cx="150" cy="15" r="3" fill="#c7b27a"/><circle cx="210" cy="15" r="3" fill="#c7b27a"/>`;

/* chuồn chuồn */
const DF=`<g class="df" transform="rotate(-20)"><g class="wing t"><ellipse cx="-22" cy="-10" rx="30" ry="7" transform="rotate(-12 0 0)" fill="url(#gWingD)" stroke="#c99aa8" stroke-width=".8"/><ellipse cx="22" cy="-10" rx="30" ry="7" transform="rotate(12 0 0)" fill="url(#gWingD)" stroke="#c99aa8" stroke-width=".8"/></g>
 <g class="wing b"><ellipse cx="-20" cy="4" rx="26" ry="6" transform="rotate(14 0 0)" fill="url(#gWingD)" stroke="#c99aa8" stroke-width=".8"/><ellipse cx="20" cy="4" rx="26" ry="6" transform="rotate(-14 0 0)" fill="url(#gWingD)" stroke="#c99aa8" stroke-width=".8"/></g>
 <circle cx="0" cy="-20" r="5" fill="#d58ea2"/><rect x="-2.2" y="-16" width="4.4" height="58" rx="2.2" fill="#d58ea2"/></g>`;
document.querySelectorAll('.df-svg').forEach(s=>s.innerHTML=DF);

/* nền loang + hoạ tiết từng trang */
const W1=wash([[180,200,330,G1,.55],[1780,140,300,G1,.5],[1500,980,260,G2,.6],[960,560,420,P1,.35],[300,960,260,G2,.6],[1820,640,200,G2,.45]]);
document.querySelectorAll('.wash').forEach((s,i)=>s.innerHTML=W1);

document.querySelector('.s1 .deco').innerHTML=
  `<g class="a a-rise" style="--d:.1s">${clusterLeft()}</g>`+
  `<g class="a a-down" style="--d:.5s">${clusterTopRight()}</g>`+
  `<g class="a a-rise" style="--d:.7s"><g transform="translate(1920 0) scale(-1 1)">${leaf(120,1000,.8,-6,120)}${lotus(70,960,.7,'w')}${bud(220,940,.5,'p',200)}</g></g>`;

document.querySelector('.s2 .deco').innerHTML=
  `<g class="a a-rise" style="--d:.1s">${clusterLeft()}</g>`+
  `<g class="a a-down" style="--d:.5s">${clusterTopRight()}</g>`;

seed=29;
document.querySelector('.s3 .deco').innerHTML=
  `<g class="a a-down" style="--d:.4s"><g transform="translate(1480 -40)">${leaf(300,170,.85,-14)}${lotus(250,140,.85,'p')}${bud(370,120,.55,'p',120)}</g></g>`+
  `<g class="a a-rise" style="--d:.2s"><g transform="translate(0 0)">${pod(140,700,.8,400,-5)}${leaf(220,780,.9,6,300)}${lotus(110,560,.85,'p',520)}${lotus(240,900,.9,'w',200)}${bud(330,700,.55,'p',400)}${leaf(80,1000,1,-3,100)}</g></g>`;

seed=47;
let archL='';archL+=padLeaf(130,860,.75,-10)+padLeaf(520,870,.7,8)+lotus(150,830,.55,'p')+lotus(470,840,.5,'w')+bud(330,850,.4,'p',80)+bud(250,860,.33,'w',60);
document.querySelector('.arch-lotus').innerHTML=archL;
document.querySelector('.s4 .deco').innerHTML=
  `<g class="a a-rise" style="--d:.2s">${clusterLeft()}</g>`+
  `<g class="a a-rise" style="--d:.5s"><g transform="translate(1920 0) scale(-1 1)">${pod(50,720,.9,380,-6)}${lotus(90,180,.75,'w',920)}${lotus(170,860,1,'p',260)}${leaf(80,960,1.1,-4,160)}${bud(250,700,.6,'w',400)}</g></g>`;

/* =========================================================
   CÁNH HOA RƠI + LẤP LÁNH (canvas)
   ========================================================= */
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');
let W,H,DPR,K;
const PALETTE=['#ffffff','#f6dde3','#e3ecc8','#f1c8d3','#ffffff','#d8e5bb'];
const R=Math.random;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);K=Math.min(W/1920,H/1080);
  document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${K})`}
class Petal{
  constructor(){this.reset(true)}
  reset(init){this.x=R()*(W+100)-50;this.y=init?R()*H*2-H:-30-R()*90;this.s=.6+R()*.8;this.vy=.4+R()*.8;this.vx=-.1+R()*.6;
    this.r=R()*6.28;this.vr=(R()-.5)*.04;this.f=R()*6.28;this.vf=.015+R()*.03;this.sw=R()*6.28;this.c=PALETTE[Math.floor(R()*PALETTE.length)];this.spark=R()<.2;this.t=R()*6.28}
  step(){this.sw+=.01;this.t+=.045;this.y+=this.vy*K*1.4;this.x+=(this.vx+Math.sin(this.sw)*.7)*K*1.4;this.r+=this.vr;this.f+=this.vf;if(this.y>H+40||this.x>W+80)this.reset(false)}
  draw(){const z=K*this.s;ctx.save();ctx.translate(this.x,this.y);
    if(this.spark){ctx.globalAlpha=.3+.7*Math.abs(Math.sin(this.t));ctx.fillStyle='#fff8dc';ctx.shadowColor='#e8cf86';ctx.shadowBlur=12*z;const Rr=6*z;
      ctx.beginPath();ctx.moveTo(0,-Rr);ctx.quadraticCurveTo(0,0,Rr,0);ctx.quadraticCurveTo(0,0,0,Rr);ctx.quadraticCurveTo(0,0,-Rr,0);ctx.quadraticCurveTo(0,0,0,-Rr);ctx.fill()}
    else{ctx.rotate(this.r);ctx.scale(1,Math.cos(this.f));ctx.globalAlpha=.88;const L=18*z;const g=ctx.createLinearGradient(0,-L,0,L);g.addColorStop(0,'#ffffff');g.addColorStop(1,this.c);
      ctx.fillStyle=g;ctx.strokeStyle='rgba(150,170,120,.35)';ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(0,L);ctx.bezierCurveTo(-L*.9,L*.3,-L*.8,-L*.8,-L*.15,-L);ctx.quadraticCurveTo(0,-L*.75,L*.15,-L);ctx.bezierCurveTo(L*.8,-L*.8,L*.9,L*.3,0,L);ctx.fill();ctx.stroke()}
    ctx.restore()}
}
let petals=[];
function loop(){ctx.clearRect(0,0,W,H);for(const p of petals){p.step();p.draw()}requestAnimationFrame(loop)}
addEventListener('resize',resize);resize();petals=Array.from({length:Math.round(36*Math.max(.6,K))},()=>new Petal());loop();

/* =========================================================
   TRÌNH CHIẾU
   ========================================================= */
const slides=[...document.querySelectorAll('.slide')];
const dotsBox=document.getElementById('dots'),bar=document.getElementById('bar');
slides.forEach((_,i)=>{const d=document.createElement('span');d.onclick=()=>go(i);dotsBox.appendChild(d)});
let cur=-1,playing=true,timer=null,startT=0,elapsed=0;const DUR=CONFIG.slideSeconds*1000;
function go(i){i=(i+slides.length)%slides.length;if(cur>=0)slides[cur].classList.remove('active');cur=i;const s=slides[cur];void s.offsetWidth;s.classList.add('active');
  [...dotsBox.children].forEach((d,k)=>d.classList.toggle('on',k===cur));elapsed=0;startT=performance.now();schedule()}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>go(cur+1),DUR-elapsed)}
function tick(){const e=playing?elapsed+performance.now()-startT:elapsed;bar.style.width=Math.min(100,e/DUR*100)+'%';requestAnimationFrame(tick)}
function togglePlay(){if(playing){elapsed+=performance.now()-startT;clearTimeout(timer)}else startT=performance.now();playing=!playing;
  document.getElementById('bPlay').innerHTML=playing?'&#10074;&#10074;':'&#9654;';schedule()}
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
const bgm=document.getElementById('bgm');if(CONFIG.music)bgm.src=CONFIG.music;
function toggleMusic(force){if(!CONFIG.music)return;const on=force??bgm.paused;
  if(on)bgm.play().then(()=>document.getElementById('bMusic').classList.remove('off')).catch(()=>{});else{bgm.pause();document.getElementById('bMusic').classList.add('off')}}
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bNext').onclick=()=>go(cur+1);
document.getElementById('bPlay').onclick=togglePlay;
document.getElementById('bFull').onclick=fullscreen;
document.getElementById('bMusic').onclick=()=>toggleMusic();
let musicTried=false;
addEventListener('pointerdown',()=>{if(!musicTried){musicTried=true;toggleMusic(true)}});
addEventListener('keydown',e=>{
  if(!musicTried&&e.key.toLowerCase()!=='m'){musicTried=true;toggleMusic(true)}
  switch(e.key){
    case 'ArrowRight':case 'PageDown':go(cur+1);break;
    case 'ArrowLeft':case 'PageUp':go(cur-1);break;
    case ' ':e.preventDefault();togglePlay();break;
    case 'f':case 'F':fullscreen();break;
    case 'm':case 'M':musicTried=true;toggleMusic();break;
    case 'h':case 'H':document.body.classList.toggle('hide-ui');break;
    default:if(/^[1-9]$/.test(e.key)&&+e.key<=slides.length)go(+e.key-1);
  }});
let idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)}
addEventListener('mousemove',wake);wake();
setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
/* tự phát nhạc ngay khi mở trang; nếu trình duyệt chặn thì phát ở thao tác đầu tiên */
if(CONFIG.music){bgm.play().then(()=>{musicTried=true;document.getElementById('bMusic').classList.remove('off')}).catch(()=>{});
  ['pointermove','mousemove','wheel','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(bgm.paused&&!musicTried){bgm.play().then(()=>{musicTried=true;document.getElementById('bMusic').classList.remove('off')}).catch(()=>{})}},{passive:true}))}
(document.fonts?.ready||Promise.resolve()).then(()=>{go(0);tick()});
</script>
